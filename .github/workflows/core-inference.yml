name: Core inference tests

on:
  push:
    branches: ["integration/shawky-core-rework"]
  pull_request:
    branches: ["main"]

jobs:
  inference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install core test dependencies
        run: python -m pip install numpy pandas scikit-learn joblib pytest
      - name: Run inference and explanation tests
        run: python -m pytest tests/test_inference.py tests/test_streamlit_integration_contract.py -q
      - name: Compile core modules
        run: python -m compileall -q app/main.py src/phishx/inference.py src/phishx/explainability
